name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (Mago)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/mago fmt --dry-run

      - name: Lint
        run: vendor/bin/mago lint --reporting-format=github

      - name: Static analysis
        run: vendor/bin/mago analyze --reporting-format=github

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  symfony-next:
    name: Tests (Symfony 8.2, in development)
    runs-on: ubuntu-latest
    # Symfony 8.2 is not released yet: its changes must not block the build
    continue-on-error: true
    env:
      SYMFONY_REQUIRE: '8.2.*'
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl
          coverage: none
          tools: composer:v2, flex

      - name: Allow development versions
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit
